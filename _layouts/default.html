<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "Mobyle - Mobile App Development" }}</title>
    {%- if page.description %}
    <meta name="description" content="{{ page.description | escape }}">
    {%- endif %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {%- for stylesheet in page.extra_css %}
    <link rel="stylesheet" href="{{ stylesheet | relative_url }}?v={{ site.time | date: '%s' }}">
    {%- endfor %}
    {%- for script in page.extra_js %}
    <script src="{{ script | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
    {%- endfor %}
</head>
<body>
    {{ content }}

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Mobyle. All rights reserved.</p>
            <div class="footer-links">
                <a href="{{ page.github_url | default: 'https://github.com/mobyleOfficial' }}" target="_blank">GitHub</a>
            </div>
        </div>
    </footer>
</body>
</html>
